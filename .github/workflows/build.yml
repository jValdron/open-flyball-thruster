name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's packaged OpenSCAD is from 2021, so use the newest nightly
      # AppImage. Old snapshots get pruned from files.openscad.org, so this picks
      # whatever is newest rather than pinning one. `make verify` compares
      # geometry, not bytes, so a different OpenSCAD build doesn't cause
      # false failures.
      - name: Install OpenSCAD (latest snapshot)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libopengl0 libglu1-mesa libfontconfig1
          name=$(curl -fsSL https://files.openscad.org/snapshots/ \
            | grep -oE 'OpenSCAD-[0-9]{4}\.[0-9]{2}\.[0-9]{2}-x86_64\.AppImage' | sort -uV | tail -1)
          echo "Using $name"
          cd "$RUNNER_TEMP"
          curl -fsSLo openscad.AppImage "https://files.openscad.org/snapshots/$name"
          chmod +x openscad.AppImage
          ./openscad.AppImage --appimage-extract > /dev/null
          echo "OPENSCAD=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: OpenSCAD version
        run: $OPENSCAD --version

      - name: Fetch BOLTS
        run: make bolts

      - name: Build parts (fail on warnings) and compare with committed STLs
        run: make verify

      - name: Check thruster.scad assembly
        run: make check-assembly
